spring.application.name=gmail-fraud-detection-java
server.port=${SERVER_PORT:8080}
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/gmail_fraud_detection}
spring.data.mongodb.auto-index-creation=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
app.jwt.expiration=${JWT_EXPIRATION:900000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:8080}
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/oauth/callback}
google.scopes=${GMAIL_SCOPES:https://www.googleapis.com/auth/gmail.readonly}
google.oauth-enabled=${GOOGLE_OAUTH_ENABLED:false}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:10}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.resend-seconds=${OTP_RESEND_SECONDS:60}
app.ml.model-version=${ML_MODEL_VERSION:java-phishing-lr-v1}
app.ml.model-path=${ML_MODEL_PATH:ml-model/java-phishing-lr-v1.model}
app.risk.ml-weight=${ML_WEIGHT:0.55}
app.risk.rule-weight=${RULE_WEIGHT:0.45}
gmail.sync.enabled=${GMAIL_SYNC_ENABLED:false}
gmail.sync.interval-ms=${GMAIL_SYNC_INTERVAL_MS:900000}
spring.jackson.serialization.write-dates-as-timestamps=false
